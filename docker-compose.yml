name: ps2-uad

services:
  # PHP-FPM + composer + node. Pertama kali jalan: scaffold Laravel otomatis.
  app:
    build:
      context: ./docker/php
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: ps2-uad-app
    container_name: ps2-app
    working_dir: /var/www/html
    environment:
      LARAVEL_VERSION: ${LARAVEL_VERSION:-^12.0}
      APP_PORT: ${APP_PORT:-8000}
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    container_name: ps2-web
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: ps2-db
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+07:00
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-ps2_uad}
      MYSQL_USER: ${DB_USERNAME:-ps2}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Vite dev server (HMR). Nunggu app selesai bootstrap dulu.
  # Image harus Debian/glibc (bukan alpine) biar cocok sama node_modules dari container app.
  vite:
    image: node:22-bookworm-slim
    container_name: ps2-vite
    working_dir: /var/www/html
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./:/var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    command: bash -c "until [ -f storage/app/.bootstrapped ]; do sleep 3; done; npm run dev -- --host 0.0.0.0"
    depends_on:
      - app
    restart: unless-stopped

  # Opsional: docker compose --profile workers up -d
  queue:
    image: ps2-uad-app
    container_name: ps2-queue
    profiles: ["workers"]
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: bash -c "until [ -f storage/app/.bootstrapped ]; do sleep 3; done; php artisan queue:work --tries=3 --sleep=3"
    depends_on:
      - app
    restart: unless-stopped

  scheduler:
    image: ps2-uad-app
    container_name: ps2-scheduler
    profiles: ["workers"]
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: bash -c "until [ -f storage/app/.bootstrapped ]; do sleep 3; done; php artisan schedule:work"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  dbdata:
